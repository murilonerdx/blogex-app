<h1 class="text-center mt-10 font-bold text-4xl">Em desenvolvimento </h1>
<div class="flex justify-center items-center h-screen p-10 ">
  <div class="grid md:grid-cols-2 grid-cols-1  border rounded-3xl">
    <div class="flex justify-center items-center p-5">
      <form (ngSubmit)="onLogin()">
        <h1 class="text-center mb-10 font-bold text-4xl">Acessar </h1>
        <p *ngIf="errorMessage" class="text-sm text-red-600 text-center mb-5">E-mail ou senha invalidos</p>

        <input [(ngModel)]="email" type="text" name="email" class=" bg-gray-100 border outline-none rounded-md py-3 w-full px-4 mb-3" placeholder="Email" required>
        <input [(ngModel)]="password" type="password" name="password" class=" bg-gray-100 border outline-none rounded-md py-3 w-full px-4 mb-3" placeholder="Senha" required>
        <button type="submit" class=" bg-yellow-400 hover:bg-yellow-500 border outline-none rounded-md py-3 w-full px-4 font-semibold text-white">Entrar</button>
      </form>

    </div>

    <div class="">
      <img src="https://img.freepik.com/premium-vector/vector-abstract-seamless-pattern-with-stars-blue-background_117177-1008.jpg" class="rounded-3xl"  alt="">
    </div>
  </div>

</div>
